    <header>
        <h1>Contact Me</h1>
    </header>

    <form action="mailinglist.php" method="POST" class="contact-form">
    <fieldset>
        <legend>Contact Me</legend>
        <p class="form-intro">Have any questions? Fill out this form below!</p>

        <div class="form-group inline-group">
            <label for="title-input">Title:</label>
            <input type="text" list="title" name="title" id="title-input" placeholder="Select or type">
            <datalist id="title">
                <option value="Mr.">
                <option value="Mrs.">
                <option value="Ms.">
                <option value="Dr.">
            </datalist>
        </div>

        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required placeholder="First Last">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required placeholder="your.email@example.com">
        </div>

        <div class="form-group">
            <label for="message">Message:</label>
            <textarea name="message" id="message" rows="5" required placeholder="Your message here..."></textarea>
        </div>

        <div class="radio-section">
            <p class="radio-title">Where are you from?</p>
            <div class="radio-options">
                <label><input type="radio" name="location" value="North America" checked> North America</label>
                <label><input type="radio" name="location" value="South America"> South America</label>
                <label><input type="radio" name="location" value="Europe"> Europe</label>
                <label><input type="radio" name="location" value="Asia"> Asia</label>
                <label><input type="radio" name="location" value="Africa"> Africa</label>
                <label><input type="radio" name="location" value="Australia"> Australia</label>
            </div>
        </div>

        <input type="submit" value="Submit" class="submit-btn">
    </fieldset>
</form>
